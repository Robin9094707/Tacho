name: Tacho
options:
  bundleIdPrefix: de.tacho
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_PREVIEWS: YES
targets:
  Tacho:
    type: application
    platform: iOS
    sources:
      - path: Tacho
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.tacho.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: Tacho/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
    info:
      path: Tacho/Info.plist
      properties:
        CFBundleDisplayName: Tacho
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
          - location-services
          - gps
        UIBackgroundModes:
          - location
        UIUserInterfaceStyle: Dark
        NSLocationWhenInUseUsageDescription: Tacho misst deine Geschwindigkeit per GPS und zeichnet deine Routen auf.
        NSLocationAlwaysAndWhenInUseUsageDescription: Damit Aufzeichnungen auch bei gesperrtem Bildschirm weiterlaufen, braucht Tacho Zugriff auf deinen Standort im Hintergrund.
        NSMotionUsageDescription: Tacho nutzt Bewegungs- und Barometerdaten, um zu erkennen, ob du läufst, rennst, Rad, E-Scooter, Auto oder Zug fährst – und auf welcher Etage du bist.
        ITSAppUsesNonExemptEncryption: false
